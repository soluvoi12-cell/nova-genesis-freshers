      padding: 12px 15px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s;
    }
    .input-group input:focus {
      border-color: #00E5FF;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #d4af37, #00E5FF);
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      transition: 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.8);
    }

    #portal-screen { display: none; opacity: 0; }
    
    #passCanvas {
      width: 100%;
      border-radius: 15px;
      border: 2px solid #FFD700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
      margin-top: 15px;

      border: 1px dashed #00E5FF;
      border-radius: 10px;
      cursor: pointer;
      margin-bottom: 15px;
      transition: 0.3s;
      font-weight: 600;

    let currentUser = null;

    // Background Particle Canvas
    const bgCanvas = document.getElementById('bg-canvas');
    const ctxBg = bgCanvas.getContext('2d');
    let particles = [];

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    for(let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        radius: Math.random() * 2,
        vx: (Math.random() - 0.5) * 0.5,
        vy: (Math.random() - 0.5) * 0.5
      });
    }

    function animateParticles() {
      ctxBg.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      ctxBg.fillStyle = 'rgba(0, 229, 255, 0.7)';
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(p.x < 0 || p.x > bgCanvas.width) p.vx *= -1;
        if(p.y < 0 || p.y > bgCanvas.height) p.vy *= -1;
        ctxBg.beginPath();
        ctxBg.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctxBg.fill();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

      const uInput = document.getElementById("username").value.trim().toUpperCase();
      const pInput = document.getElementById("password").value.trim().toUpperCase();

        x.username.trim().toUpperCase() === uInput && 
        x.pass.trim().toUpperCase() === pInput
      );

        currentUser = user;
        document.getElementById("error-msg").style.display = "none";

        confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });

        gsap.to("#login-screen", {
          duration: 0.6,
          scale: 0.8,
          opacity: 0,
          onComplete: () => {
            document.getElementById("login-screen").style.display = "none";
            const portal = document.getElementById("portal-screen");
            portal.style.display = "block";
            document.getElementById("welcome-text").innerText = `WELCOME, ${user.name.toUpperCase()}`;
            
            gsap.fromTo(portal, 
              { scale: 0.8, opacity: 0 }, 
              { duration: 0.8, scale: 1, opacity: 1, ease: "back.out(1.7)" }
            );
          }
        });
      } else {
        const errorElem = document.getElementById("error-msg");
        errorElem.style.display = "block";
        gsap.fromTo("#login-screen", { x: -10 }, { duration: 0.1, x: 10, repeat: 5, yoyo: true });
      }
    }

    // PHOTO UPLOAD & PASS GENERATOR
    document.getElementById("photoInput").addEventListener("change", function(e) {
      if(!e.target.files || !e.target.files[0]) return;
      
      const statusText = document.getElementById("status-text");
      statusText.style.display = "block";
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const userPhoto = new Image();
        userPhoto.onload = function() {
          
          const canvas = document.getElementById("passCanvas");
          const ctx = canvas.getContext("2d");

          const masterImg = new Image();
          masterImg.src = 'master_card.png';

          function renderCard(bgImg = null) {
            if(bgImg) {
              canvas.width = bgImg.width;
              canvas.height = bgImg.height;
              ctx.drawImage(bgImg, 0, 0);
              
              // Draw User Photo
              ctx.drawImage(userPhoto, 115, 345, 350, 420);

              // Draw Text
              ctx.fillStyle = "#FFD700";
              ctx.font = "bold 38px Poppins, sans-serif";
              ctx.fillText(currentUser.name, 540, 415);

              ctx.fillStyle = "#FFFFFF";
              ctx.font = "bold 32px Poppins, sans-serif";
              ctx.fillText(currentUser.id, 540, 510);
            } else {
              // Fallback Card Canvas Generation
              canvas.width = 1000;
              canvas.height = 1400;

              // Dark Background
              ctx.fillStyle = "#0a0e1a";
              ctx.fillRect(0, 0, canvas.width, canvas.height);

              // Gold Border Glow
              ctx.strokeStyle = "#FFD700";
              ctx.lineWidth = 10;
              ctx.strokeRect(30, 30, canvas.width - 60, canvas.height - 60);

              // Header
              ctx.fillStyle = "#00E5FF";
              ctx.font = "bold 55px Orbitron, sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("NOVA GENESIS 2026", canvas.width / 2, 130);

              ctx.fillStyle = "#FFD700";
              ctx.font = "28px Poppins, sans-serif";
              ctx.fillText("VIRTUAL FRESHERS PARTY PASS", canvas.width / 2, 190);

              // Draw User Photo
              ctx.strokeStyle = "#00E5FF";
              ctx.lineWidth = 6;
              ctx.strokeRect(100, 280, 380, 480);
              ctx.drawImage(userPhoto, 105, 285, 370, 470);

              // Details
              ctx.textAlign = "left";
              ctx.fillStyle = "#94a3b8";
              ctx.font = "28px Poppins, sans-serif";
              ctx.fillText("GUEST NAME:", 520, 360);

              ctx.fillStyle = "#FFD700";
              ctx.font = "bold 42px Poppins, sans-serif";
              ctx.fillText(currentUser.name, 520, 420);

              ctx.fillStyle = "#94a3b8";
              ctx.font = "28px Poppins, sans-serif";
              ctx.fillText("UNIQUE ID:", 520, 520);

              ctx.fillStyle = "#00E5FF";
              ctx.font = "bold 38px Orbitron, sans-serif";
              ctx.fillText(currentUser.id, 520, 580);

              // Event Info Box
              ctx.fillStyle = "rgba(255,255,255,0.05)";
              ctx.fillRect(100, 850, 800, 380);
              ctx.strokeStyle = "rgba(212,175,55,0.4)";
              ctx.strokeRect(100, 850, 800, 380);

              ctx.fillStyle = "#FFD700";
              ctx.font = "bold 32px Poppins, sans-serif";
              ctx.fillText("EVENT DETAILS", 140, 910);

              ctx.fillStyle = "#FFFFFF";
              ctx.font = "28px Poppins, sans-serif";
              ctx.fillText("DATE: AUGUST 19, 2026", 140, 980);
              ctx.fillText("TIME: 9:00 AM TO 4:30 PM (IST)", 140, 1040);
              ctx.fillText("VENUE: THE EXAM BUILDING (VIRTUAL)", 140, 1100);
            }

            statusText.style.display = "none";
            document.getElementById("canvas-wrapper").style.display = "block";
            gsap.from("#canvas-wrapper", { duration: 0.8, y: 20, opacity: 0 });

            const downloadBtn = document.getElementById("downloadBtn");
            downloadBtn.href = canvas.toDataURL("image/jpeg", 0.95);
            downloadBtn.download = `NG2026_${currentUser.name.replace(/\s+/g, '_')}.jpg`;
          }

          masterImg.onload = function() { renderCard(masterImg); };
          masterImg.onerror = function() { renderCard(null); };
        };
        userPhoto.src = event.target.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });
  </script>
</body>
</html>
